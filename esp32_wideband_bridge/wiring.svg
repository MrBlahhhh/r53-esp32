<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .subtitle { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #555; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .small { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #444; }
      .wire-label { font: 600 11px 'Segoe UI', Arial, sans-serif; }
      .box-title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .pin { font: 600 11px 'Consolas', 'Courier New', monospace; fill: #1a1a1a; }
      .note { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #333; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#f7f8fa"/>
  <text x="32" y="36" class="title">XIAO ESP32S3 Wideband O2 Bridge ? Wiring</text>
  <text x="32" y="56" class="subtitle">Analog 0?5 V AFR ? 10k/10k divider ? D0 / GPIO1 (or ADS1115 A0) ? BLE notify</text>

  <rect x="40" y="90" width="240" height="300" rx="8" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" class="box-title">Wideband Controller</text>
  <text x="160" y="138" text-anchor="middle" class="small" fill="#cbd5e1">AEM / Innovate LC-1 / LC-2</text>

  <rect x="60" y="160" width="200" height="36" rx="4" fill="#e74c3c"/>
  <text x="160" y="183" text-anchor="middle" class="label" fill="#fff">+12V Power (Red)</text>
  <rect x="60" y="210" width="200" height="36" rx="4" fill="#2d3436"/>
  <text x="160" y="233" text-anchor="middle" class="label" fill="#fff">Ground</text>
  <rect x="60" y="260" width="200" height="36" rx="4" fill="#f1c40f"/>
  <text x="160" y="283" text-anchor="middle" class="label" fill="#1a1a1a">Analog Out 0?5V</text>
  <rect x="60" y="310" width="200" height="36" rx="4" fill="#8e44ad"/>
  <text x="160" y="333" text-anchor="middle" class="label" fill="#fff">Analog ? / Cal (opt.)</text>
  <text x="160" y="370" text-anchor="middle" class="small" fill="#95a5a6">AEM: Wht + / Brn ? ? GND</text>
  <text x="160" y="386" text-anchor="middle" class="small" fill="#95a5a6">Innovate: Yel analog / Blu-Wht GND</text>

  <rect x="40" y="420" width="240" height="70" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text x="160" y="448" text-anchor="middle" class="label">Vehicle +12V / GND</text>
  <text x="160" y="470" text-anchor="middle" class="small">Common ground with XIAO required</text>

  <rect x="360" y="160" width="200" height="220" rx="8" fill="#fff" stroke="#2980b9" stroke-width="2"/>
  <text x="460" y="188" text-anchor="middle" class="label" fill="#2980b9">10k / 10k Divider</text>
  <text x="460" y="206" text-anchor="middle" class="small">midpoint ? 0?2.5 V</text>
  <rect x="430" y="230" width="60" height="24" rx="3" fill="#f39c12" stroke="#d68910"/>
  <text x="460" y="247" text-anchor="middle" class="pin">R1 10k</text>
  <rect x="430" y="300" width="60" height="24" rx="3" fill="#f39c12" stroke="#d68910"/>
  <text x="460" y="317" text-anchor="middle" class="pin">R2 10k</text>
  <line x1="460" y1="230" x2="460" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="254" x2="460" y2="300" stroke="#333" stroke-width="2"/>
  <circle cx="460" cy="277" r="5" fill="#27ae60"/>
  <line x1="460" y1="324" x2="460" y2="360" stroke="#333" stroke-width="2"/>
  <text x="472" y="282" class="small">tap</text>
  <text x="470" y="355" class="small">GND</text>

  <line x1="280" y1="278" x2="460" y2="210" stroke="#f1c40f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="240" class="wire-label" fill="#b7950b">White (AEM) / Yellow (Innovate)</text>

  <line x1="280" y1="228" x2="340" y2="228" stroke="#2d3436" stroke-width="3"/>
  <line x1="340" y1="228" x2="340" y2="520" stroke="#2d3436" stroke-width="3"/>
  <line x1="340" y1="520" x2="780" y2="520" stroke="#2d3436" stroke-width="3"/>
  <text x="288" y="220" class="wire-label" fill="#2d3436">GND</text>
  <line x1="460" y1="360" x2="460" y2="520" stroke="#2d3436" stroke-width="2"/>

  <rect x="640" y="110" width="320" height="340" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="800" y="140" text-anchor="middle" class="box-title">XIAO ESP32S3</text>
  <text x="800" y="160" text-anchor="middle" class="small" fill="#bbdefb">BLE: R53-Wideband</text>
  <rect x="660" y="185" width="280" height="36" rx="4" fill="#fff"/>
  <text x="800" y="208" text-anchor="middle" class="pin">D0 / GPIO1 (ADC) ? divider mid</text>
  <rect x="660" y="235" width="280" height="36" rx="4" fill="#fff"/>
  <text x="800" y="258" text-anchor="middle" class="pin">GND ? common ground</text>
  <rect x="660" y="285" width="280" height="36" rx="4" fill="#fff"/>
  <text x="800" y="308" text-anchor="middle" class="pin">D4 SDA / D5 SCL (opt. ADS1115)</text>
  <rect x="660" y="335" width="280" height="36" rx="4" fill="#fff"/>
  <text x="800" y="358" text-anchor="middle" class="pin">USB-C / 5V ? board power only</text>
  <text x="800" y="400" text-anchor="middle" class="small" fill="#e3f2fd">Optional ADS1115: VDD?3V3, A0?tap,</text>
  <text x="800" y="418" text-anchor="middle" class="small" fill="#e3f2fd">SDA?D4 (GPIO5), SCL?D5 (GPIO6)</text>
  <text x="800" y="436" text-anchor="middle" class="small" fill="#e3f2fd">Phone selects mode over BLE GATT</text>

  <line x1="465" y1="277" x2="660" y2="203" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="520" y="230" class="wire-label" fill="#1e8449">?0?2.5 V</text>
  <line x1="800" y1="450" x2="800" y2="520" stroke="#2d3436" stroke-width="3"/>

  <rect x="40" y="560" width="920" height="90" rx="6" fill="#fff" stroke="#bdc3c7"/>
  <text x="56" y="586" class="note">? Never feed 0?5 V analog directly into a XIAO ADC pin. Use the 10k+10k divider (DIVIDER_GAIN = 2.0).</text>
  <text x="56" y="608" class="note">? Power the wideband from vehicle 12 V (Red). Power the XIAO from USB-C or regulated 5 V ? not from 12 V.</text>
  <text x="56" y="630" class="note">? Wire colors: see WIRING.md (AEM Red/Black/White/Brown; Innovate Red/Blue-White/Yellow/Black).</text>
</svg>
