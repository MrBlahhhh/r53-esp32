; PlatformIO — R53 Wideband BLE Bridge + Shift Light (one ESP32)
; Board: Seeed Studio XIAO ESP32S3 (USB-C, BLE).
; Docs: https://docs.platformio.org/en/latest/boards/espressif32/seeed_xiao_esp32s3.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; NimBLE 2.x matches arduino-esp32 3.x (S3). 1.4.x panics on BT init.
; FastLED 3.7+ has RMT5 support for the S3 on the 3.x core.
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    fastled/FastLED@^3.7.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
